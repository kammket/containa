# Lokale Entwicklungsumgebung.
#
# Startet Postgres und Redis. Die Anwendungen selbst laufen bewusst außerhalb
# von Docker (npm run dev), weil Hot Reload dort deutlich schneller ist.
# Für einen vollständigen Containerlauf siehe docker-compose.prod.yml.

services:
  postgres:
    image: postgres:17-alpine
    container_name: emc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-emc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emc_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-emc_container}
      # Deutsche Sortier- und Zeichensatzeinstellungen für korrekte Umlautsortierung
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-emc} -d ${POSTGRES_DB:-emc_container}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: emc-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
